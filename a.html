<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও প্লেয়ার</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
        }
        iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
            border: none;
            border-radius: 8px;
        }
        .download-btn {
            display: inline-block;
            background: #1e88e5;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }
        .download-btn:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- ভিডিও iframe - আপনার মূল কোড থেকে নেওয়া (HD ও ফুলস্ক্রিন সমর্থনসহ) -->
        <iframe allowfullscreen="allowfullscreen" frameborder="0" src="https://fuck-date-app.com/video_app/videos/1/312.mp4"></iframe>
        <div style="text-align: center;">
            <!-- ডাউনলোড বাটন - ফেসবুক লিংকে নিয়ে যাবে -->
            <a href="https://www.facebook.com/share/1DNpPPLw3u/" target="_blank" class="download-btn">📥 ডাউনলোড</a>
        </div>
    </div>
</body>
</html>
